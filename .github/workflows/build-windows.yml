name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/community-photos-20261122'
    paths:
      - 'app/**'
      - 'gates/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: gates/gate3
        run: |
          pip install jaraco.text
          pip install -r requirements.txt

      - name: Verify updater contracts
        run: |
          python tests/test_windows_updates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_update_routes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_windows_auto_updates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_community*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_aircraft_photo_metadata.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with PyInstaller
        working-directory: gates/gate3
        run: |
          pyinstaller --noconfirm `
            --onedir `
            --name AirTrack `
            --paths "../.." `
            --paths "../../app" `
            --add-data "../../app/templates;app/templates" `
            --add-data "../../app/static;app/static" `
            --add-data "../../app/migrations;app/migrations" `
            --add-data "../../app/db;app/db" `
            --add-data "../../app/scripts/airports.csv;app/scripts" `
            --add-data "../../app/core;app/core" `
            --add-data "../../app/windows_release.json;app" `
            --hidden-import win32timezone `
            --hidden-import win32service `
            --hidden-import win32serviceutil `
            --hidden-import win32event `
            --hidden-import servicemanager `
            --hidden-import pywintypes `
            --hidden-import waitress `
            --hidden-import pymysql `
            --hidden-import flask `
            --hidden-import werkzeug `
            --hidden-import sqlalchemy `
            --hidden-import flask_sqlalchemy `
            --hidden-import flask_wtf `
            --hidden-import pytz `
            --hidden-import cryptography `
            --hidden-import webauthn `
            --hidden-import apscheduler `
            --hidden-import stripe `
            --hidden-import paramiko `
            --hidden-import app.app `
            --hidden-import version `
            --hidden-import extensions `
            --hidden-import routes `
            --hidden-import routes.community_photos `
            --hidden-import utils.community_photo_client `
            --hidden-import utils.aircraft_photo_metadata `
            --hidden-import utils.photo_backup `
            --collect-all mariadb `
            --collect-all tzdata `
            --collect-data jaraco `
            --distpath dist `
            --workpath build `
            --specpath . `
            service.py

      - name: Copy schema.sql into gate3
        run: Copy-Item "app\db\schema.sql" "gates\gate3\schema.sql" -Force

      - name: Cache MariaDB MSI
        uses: actions/cache@v4
        id: cache-mariadb
        with:
          path: gates/gate3/mariadb-11.4.12-winx64.msi
          key: mariadb-11.4.12-winx64-4d92fb5f16c0ec8d

      - name: Download MariaDB MSI
        if: steps.cache-mariadb.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest `
            -Uri "https://archive.mariadb.org/mariadb-11.4.12/winx64-packages/mariadb-11.4.12-winx64.msi" `
            -OutFile "gates\gate3\mariadb-11.4.12-winx64.msi" `
            -UseBasicParsing

      - name: Verify MariaDB MSI
        run: |
          $actual = (Get-FileHash "gates/gate3/mariadb-11.4.12-winx64.msi" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "4d92fb5f16c0ec8d5a9fc1efdb33a377eaa712d6bce97451e151465c3041ccac") {
            throw "MariaDB MSI checksum mismatch"
          }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Compile installer
        working-directory: gates/gate3
        run: |
          & .\compile_installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirTrack-installer
          path: gates/gate3/Output/AirTrackSetup.exe
          retention-days: 90

      - name: Upload compiled application for smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: AirTrack-application
          path: gates/gate3/dist/AirTrack/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gates/gate3/Output/AirTrackSetup.exe
          name: AirTrack ${{ github.ref_name }}
